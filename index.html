<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초강스 에듀테크 LAB · 수현T의 주간 AI 미션 통합 포털</title>
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="styles/theme-switcher.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="portal-header">
    <div class="header-container">
      <div class="portal-brand">
        <div class="logo-badge">LAB</div>
        <div class="brand-text">
          <h1>초강스 에듀테크 주간 미션 아카이브</h1>
          <p>수학교육 현장 중심 AI 에듀테크 포트폴리오</p>
        </div>
      </div>
      <div class="header-right-group">
        <div class="theme-switcher-mount"></div>
        <div class="profile-chip">
          <span>👨‍🏫 지도교사:</span>
          <strong>수현T</strong>
          <span>|</span>
          <span style="color: var(--text-muted);">난이도: 개초보</span>
        </div>
      </div>
    </div>
  </header>

  <main class="portal-main">
    <!-- Current Mission Hero Banner -->
    <section class="hero-banner">
      <div class="hero-content">
        <h2>🔥 4주차 진행 중: AI로 만드는 수학 아트</h2>
        <p>꽃잎 수와 이름을 바꾸면 회전대칭 공식(360° ÷ n)이 시각화되는 '대칭 엽서 제작기'입니다. 아래 뷰어에서 직접 조작해 보거나 새 창으로 열 수 있습니다.</p>
      </div>
      <div class="hero-action">
        <a href="week04/index.html" target="_blank" class="btn-hero">
          🌸 4주차 단독 페이지 열기 ↗
        </a>
        <button id="copyCommentMainBtn" class="btn-copy-submit">
          📋 4주차 제출 댓글 양식 복사
        </button>
      </div>
    </section>

    <!-- Week Navigator Tabs -->
    <nav class="week-tabs-bar" aria-label="주간 미션 탭">
      <!-- Week 1 -->
      <button type="button" class="week-tab-item" data-week="1" data-url="week01/index.html" data-title="WEEK 01 · 맞춤형 학습 리포트">
        <div class="tab-top-row">
          <span class="tab-week-num">WEEK 01</span>
          <span class="tab-status-badge badge-done">완료</span>
        </div>
        <div class="tab-title">맞춤형 학습 리포트</div>
        <p class="tab-desc">수현T 이름과 가상 학생의 강점·보완점·목표를 담은 학부모용 1장 리포트</p>
      </button>

      <!-- Week 2 -->
      <button type="button" class="week-tab-item" data-week="2" data-url="week02/index.html" data-title="WEEK 02 · 학부모 공지 제작기">
        <div class="tab-top-row">
          <span class="tab-week-num">WEEK 02</span>
          <span class="tab-status-badge badge-done">완료</span>
        </div>
        <div class="tab-title">학부모 공지 제작기</div>
        <p class="tab-desc">입력 즉시 기본형, 카카오톡형, 친근형 3종 공지문 및 모바일 카드 자동 생성</p>
      </button>

      <!-- Week 3 -->
      <button type="button" class="week-tab-item" data-week="3" data-url="week03/index.html" data-title="WEEK 03 · 일차함수 개념카드">
        <div class="tab-top-row">
          <span class="tab-week-num">WEEK 03</span>
          <span class="tab-status-badge badge-done">완료</span>
        </div>
        <div class="tab-title">일차함수 개념카드</div>
        <p class="tab-desc">기울기 m과 y절편 b를 움직이는 그래프로 조작하며 식·좌표표 동시 탐구</p>
      </button>

      <!-- Week 4 (Active Default) -->
      <button type="button" class="week-tab-item active" data-week="4" data-url="week04/index.html" data-title="WEEK 04 · 회전대칭 엽서 (AI 수학 아트)">
        <div class="tab-top-row">
          <span class="tab-week-num">WEEK 04</span>
          <span class="tab-status-badge badge-active">이번 주 미션</span>
        </div>
        <div class="tab-title">회전대칭 엽서 제작기</div>
        <p class="tab-desc">꽃잎 수(4~16)에 따른 회전각 계산, 중심축 표시, 테마 변경 및 SVG 다운로드</p>
      </button>
    </nav>

    <!-- Interactive Live Viewer -->
    <section class="viewer-section">
      <div class="viewer-header-bar">
        <div class="vh-left">
          <div class="browser-dots">
            <span class="browser-dot dot-red"></span>
            <span class="browser-dot dot-yellow"></span>
            <span class="browser-dot dot-green"></span>
          </div>
          <span class="vh-title" id="viewerTitle">WEEK 04 · 회전대칭 엽서 (AI 수학 아트)</span>
        </div>
        <div class="vh-right">
          <a href="week04/index.html" target="_blank" id="viewerExtLink" class="btn-open-ext">
            새 창으로 전체화면 열기 ↗
          </a>
        </div>
      </div>
      <iframe id="appViewerFrame" class="app-iframe" src="week04/index.html" title="주간 미션 인터랙티브 뷰어"></iframe>
    </section>
  </main>

  <div id="toast" class="toast">댓글 양식이 복사되었습니다!</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabItems = document.querySelectorAll('.week-tab-item');
      const iframe = document.getElementById('appViewerFrame');
      const viewerTitle = document.getElementById('viewerTitle');
      const viewerExtLink = document.getElementById('viewerExtLink');
      const copyBtn = document.getElementById('copyCommentMainBtn');
      const toast = document.getElementById('toast');

      // Tab switcher
      tabItems.forEach(tab => {
        tab.addEventListener('click', () => {
          tabItems.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          const targetUrl = tab.getAttribute('data-url');
          const title = tab.getAttribute('data-title');

          iframe.src = targetUrl;
          viewerTitle.textContent = title;
          viewerExtLink.href = targetUrl;
        });
      });

      // Quick Copy for Week 4 Comment
      copyBtn.addEventListener('click', () => {
        const origin = window.location.origin;
        const pathname = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        const fullWeek4Url = `${origin}${pathname}/week04/index.html`;

        const comment = `이름: 수현T
선택 난이도: 개초보
결과물 링크: ${fullWeek4Url}
만들면서 발견하거나 배운 점 한 문장: 꽃잎 수를 조절하며 360°를 n으로 나눈 각도로 균등 회전하는 원리를 직접 시각화해볼 수 있었고, 수학 수업에서 학생들과 대칭성을 탐구하기에 훌륭한 교구가 될 수 있음을 배웠습니다.`;

        navigator.clipboard.writeText(comment).then(() => {
          showToast('4주차 제출 댓글 양식이 복사되었습니다!');
        }).catch(() => {
          prompt('아래 댓글 양식을 복사하세요:', comment);
        });
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2800);
      }
    });
  </script>
</body>
</html>
